version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
    - Muckenbatscher
    labels:
    - dependencies

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
    - Muckenbatscher
    labels:
    - dependencies
    groups:
      mstest:
        patterns:
          - "MSTest*"
      core:
        patterns:
          - "Microsoft*"
          - "System*"
