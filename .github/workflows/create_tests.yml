name: Generate Testcases from Java implementation

on:
  workflow_dispatch: 
  schedule:
    - cron: '30 3 * * *'

env:
  PR_TARGET_BRANCH_NAME: master
  PR_SOURCE_BRANCH_NAME: test-generation

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ github.ref }}" != "refs/heads/${{ env.PR_TARGET_BRANCH_NAME }}" ]; then 
            echo "Can only be run for branch ${{ env.PR_TARGET_BRANCH_NAME }}"
            exit 1
          fi

  build-java:
    needs: validate-ref
    runs-on: ubuntu-latest
    
    env:
      TEST_GEN_REPO_NAME: Muckenbatscher/material-color-utilities-testcases-generation
      TEST_GEN_REPO_BRANCH: main
      OUTPUT_PATH: ${{ github.workspace }}/generated-output
    
    steps:
      - name: Checkout Test-Generation Java repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TEST_GEN_REPO_NAME }} 
          ref: ${{ env.TEST_GEN_REPO_BRANCH }}

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Get required Java dependencies
        run: |
          cd java
          curl -fSL -O https://maven.google.com/androidx/annotation/annotation-jvm/1.9.1/annotation-jvm-1.9.1.jar
          curl -fSL -O https://repo1.maven.org/maven2/com/google/errorprone/error_prone_annotations/2.45.0/error_prone_annotations-2.45.0.jar

      - name: Compile MyTest.java
        run: |
          cd java
          javac -cp ".:annotation-jvm-1.9.1.jar:error_prone_annotations-2.45.0.jar" MyTest.java

      - name: Run MyTest.java
        run: |
          cd java
          mkdir -p "${{ env.OUTPUT_PATH }}"

          java -cp ".:annotation-jvm-1.9.1.jar:error_prone_annotations-2.45.0.jar" \
            MyTest "${{ env.OUTPUT_PATH }}"
  
      - uses: actions/upload-artifact@v7
        with:
          name: generated-testcase-cs-files 
          path: ${{ env.OUTPUT_PATH }}
          retention-days: 1 
  
  create-refs:
    needs: build-java
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TEST_THEME_DIR: MaterialTheming.Tests/KnownTestThemes

    outputs:
      existing_branch: ${{ steps.existing_branch.outputs.exists }}
      has_changes: ${{ steps.check_diff.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v6

      - name: Check for existing branch
        id: existing_branch
        run: |
          if git ls-remote --exit-code --heads origin ${{ env.PR_SOURCE_BRANCH_NAME }}; then
            echo "Branch '${{ env.PR_SOURCE_BRANCH_NAME }}' already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Branch '${{ env.PR_SOURCE_BRANCH_NAME }}' does not exist yet."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout existing branch
        if: steps.existing_branch.outputs.exists == 'true'
        run: |
          git fetch origin ${{ env.PR_SOURCE_BRANCH_NAME }}
          git checkout -B ${{ env.PR_SOURCE_BRANCH_NAME }} origin/${{ env.PR_SOURCE_BRANCH_NAME }}

      - name: Create and push new branch
        if: steps.existing_branch.outputs.exists != 'true'
        run: |
          git checkout -B ${{ env.PR_SOURCE_BRANCH_NAME }}
          git push --set-upstream origin ${{ env.PR_SOURCE_BRANCH_NAME }}

      - uses: actions/download-artifact@v8
        with:
          name: generated-testcase-cs-files 
          path: ${{ env.TEST_THEME_DIR }}

      - name: Check for changes in the testcases
        id: check_diff
        run: |
          CHANGES=$(git diff --name-only -- ${{ env.TEST_THEME_DIR }})

          if [ -z "$CHANGES" ]; then
            echo "No changes found in '${{ env.TEST_THEME_DIR }}'"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in '${{ env.TEST_THEME_DIR }}'!"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Git config as github-actions
        if: steps.check_diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit generated tests
        if: steps.check_diff.outputs.has_changes == 'true'
        run: |
          git add ${{ env.TEST_THEME_DIR }}
          git commit -m "Update C# testcase files. Generated from Java reference implementation."
          git push

  generate-pr:
    needs: create-refs
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
      
      - name: Check for existing PR
        id: exsting_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list --head ${{ env.PR_SOURCE_BRANCH_NAME }} --state open --json number --jq 'length')
          if [ "$PR_COUNT" -eq "0" ]; then
            echo "No existing PR found for the branch ${{ env.PR_SOURCE_BRANCH_NAME }}."
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "Existing PR found for the branch ${{ env.PR_SOURCE_BRANCH_NAME }}."
            echo "exists=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Create Pull Request
        if:  steps.exsting_pr.outputs.exists != 'true' && (needs.create-refs.outputs.existing_branch == 'true' || needs.create-refs.outputs.has_changes == 'true')
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOW }}
        run: |
          gh pr create \
            --base ${{ env.PR_TARGET_BRANCH_NAME }} \
            --head ${{ env.PR_SOURCE_BRANCH_NAME }} \
            --title "Updated autogenerated testcases" \
            --body "Automatically generated the testcases from the java reference implementation." \
            --assignee "@me" \
            --label "test-generation"
