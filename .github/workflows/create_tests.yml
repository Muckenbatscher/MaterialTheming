name: Generate Testcases from Java implementation

on:
  workflow_dispatch: 
  schedule:
    - cron: '30 3 * * *'

jobs:
  build-java:
    runs-on: ubuntu-latest
    
    env:
      TEST_GEN_REPO_NAME: Muckenbatscher/material-color-utilities-testcases-generation
      TEST_GEN_REPO_BRANCH: main
      OUTPUT_PATH: ${{ github.workspace }}/generated-output
    
    steps:
      - name: Checkout Test-Generation Java repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TEST_GEN_REPO_NAME }} 
          ref: ${{ env.TEST_GEN_REPO_BRANCH }}

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Get required Java dependencies
        run: |
          cd java
          curl -fSL -O https://maven.google.com/androidx/annotation/annotation-jvm/1.9.1/annotation-jvm-1.9.1.jar
          curl -fSL -O https://repo1.maven.org/maven2/com/google/errorprone/error_prone_annotations/2.45.0/error_prone_annotations-2.45.0.jar

      - name: Compile MyTest.java
        run: |
          cd java
          javac -cp ".:annotation-jvm-1.9.1.jar:error_prone_annotations-2.45.0.jar" MyTest.java

      - name: Run MyTest.java
        run: |
          cd java
          mkdir -p "${{ env.OUTPUT_PATH }}"

          java -cp ".:annotation-jvm-1.9.1.jar:error_prone_annotations-2.45.0.jar" \
            MyTest "${{ env.OUTPUT_PATH }}"
  
      - uses: actions/upload-artifact@v7
        with:
          name: generated-testcase-cs-files 
          path: ${{ env.OUTPUT_PATH }}
          retention-days: 1 
  
  generate-pr:
    needs: build-java
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      PR_BRANCH_NAME: test-generation
      TEST_THEME_DIR: MaterialTheming.Tests/KnownTestThemes

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: generated-testcase-cs-files 
          path: ${{ env.TEST_THEME_DIR }}

      - name: Create branch with generated tests
        run: |
          git checkout -B ${{ env.PR_BRANCH_NAME }}
          
          git add ${{ env.TEST_THEME_DIR }}
          git commit -m "Update C# testcase files. Generated from Java reference implementation."
          git push --force origin ${{ env.SYNC_BRANCH_NAME }}
          
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "master" \
            --head ${{ env.PR_BRANCH_NAME }} \
            --title "Updated autogenerated testcases" \
            --body "Automatically generated the testcases from the java reference implementation."