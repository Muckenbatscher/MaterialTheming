name: .NET Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-test:
    strategy:  
      fail-fast: false
      matrix:  
        framework:
        - net48
        - net8.0
        - net10.0
        os: 
        - ubuntu-latest 
        - windows-latest  
        exclude:
          - os: ubuntu-latest
            framework: net48
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build --framework ${{ matrix.framework }}
    - name: Test
      run: dotnet test --no-build --framework ${{ matrix.framework }}
