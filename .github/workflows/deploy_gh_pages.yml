name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
    - master

permissions:
  contents: write
  pages: write
  id-token: write

env:
  project-name: MaterialTheming.BlazorShowcase
  repo-name: MaterialTheming
  release-output: release
  
jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x' 
          
      - name: Publish WebAssembly project
        run: dotnet publish ${{ env.project-name }} -c Release -o ${{ env.release-output }}
          
      - name: Replace base href in index.html
        run: sed -i 's/<base href="\/" \/>/<base href="\/${{ env.repo-name }}\/" \/>/g' ${{ env.release-output }}/wwwroot/index.html
        
      - name: Add .nojekyll and fix GitHub Pages routing
        run: |
          touch ${{ env.release-output }}/wwwroot/.nojekyll
          cp ${{ env.release-output }}/wwwroot/index.html ${{ env.release-output }}/wwwroot/404.html
      
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '${{ env.release-output }}/wwwroot'

      - uses: actions/deploy-pages@v5

